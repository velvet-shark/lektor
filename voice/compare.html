<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>lektor voice candidates</title>
<style>
  body { font-family: ui-monospace, monospace; background: #0b0b0f; color: #e8e4da; max-width: 720px; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.2rem; } .c { border: 1px solid #333; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
  audio { width: 100%; margin-top: .5rem; } .id { color: #888; font-size: .75rem; word-break: break-all; }
  p.note { color: #999; font-size: .85rem; }
</style>
</head>
<body>
<h1>the lektor — voice candidates</h1>
<p class="note">Same test text on every candidate. Pick the flattest one — if it sounds too good, it's wrong. Serve this dir (e.g. <code>npx serve voice</code>) so the audio files load.</p>
<div id="list"></div>
<script>
fetch("./candidates/manifest.json").then(r => r.json()).then(m => {
  document.getElementById("list").innerHTML = m.candidates.map(c =>
    `<div class="c"><strong>${c.file}</strong> (brief ${c.description + 1})
     <div class="id">generated_voice_id: ${c.id}</div>
     <audio controls preload="none" src="./candidates/${c.file}"></audio></div>`
  ).join("");
});
</script>
</body>
</html>
